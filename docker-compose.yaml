x-gazebo-simulation: &simulation
  image: farshadnh/fnh_robotnik_sim:latest
  network_mode: host
  privileged: true
  # The newer `deploy.resources.reservations.devices` (CDI-style) injection
  # exposes the NVIDIA driver .so files but not the EGL vendor ICD JSON, so
  # glvnd never selects the NVIDIA EGL backend for GUI rendering. The legacy
  # `runtime: nvidia` hook path handles the graphics capability injection
  # completely (confirmed: `docker info` lists `nvidia` as a runtime).
  runtime: nvidia
  environment:
    ROS_DOMAIN_ID: 0
    DISPLAY: ${DISPLAY}
    GZ_VERSION: harmonic
    # gz-transport independently decides which interface to bind/join its
    # discovery multicast group on (separate from CycloneDDS, and separate
    # from the host's 224.0.0.0/4-via-lo route in setup_multicast_route.sh).
    # Left to auto-detect, it picks the wifi interface, while the host route
    # redirects outbound multicast onto loopback — the two never converge,
    # so gzserver and the GUI/bridge never discover each other's topics
    # (symptom: GUI window opens but stays blank, `gz topic -l` empty from
    # a second process). Pin it to loopback so it matches the host route.
    GZ_IP: 127.0.0.1
    # Gazebo world for the `world-sim`/`spawn-robot-sim` services: loads
    # renee_rbvogui_navigation/world/${GZ_WORLD}.sdf; spawn poses per world are
    # in world_poses.sh. e.g. `GZ_WORLD=campetella docker compose up slam-sim`.
    GZ_WORLD: ${GZ_WORLD:-renee_room}
    # Saved map for the sim `localize-sim` service: maps/${SIM_MAP}.yaml
    # (map_server) + maps/${SIM_MAP}.posegraph/.data (slam_toolbox). Must match
    # GZ_WORLD: renee_room <-> renee_room, campetella <-> renee_environment.
    SIM_MAP: ${SIM_MAP:-renee_room}
    ROBOT: rbvogui
    ROBOT_MODEL: rbvogui_plus
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    # CycloneDDS auto-selects a network interface for discovery, and it
    # may pick a bad one: nodes see each other's topic names but never
    # exchange data. Pin it to loopback and skip multicast entirely
    # since every node here runs on this one machine.
    # Unicast-only discovery caps participants per host at
    # MaxAutoParticipantIndex+1 (default 10); the real-robot stack (bridge +
    # localize-real + navigate-real + UR driver/MoveIt + RViz) exceeds that
    # and new nodes die with "Failed to find a free participant index".
    # Must match vogui_ros1_ros2_bridge/docker-compose.yml.
    CYCLONEDDS_URI: "<CycloneDDS><Domain><General><Interfaces><NetworkInterface name=\"lo\"/></Interfaces><AllowMulticast>false</AllowMulticast></General><Discovery><ParticipantIndex>auto</ParticipantIndex><MaxAutoParticipantIndex>120</MaxAutoParticipantIndex><Peers><Peer address=\"127.0.0.1\"/></Peers></Discovery></Domain></CycloneDDS>"
    ROS2_CLI_DISABLE_DAEMON: 1
    RENEE_SRC_PATH: /renee/src/renee_sw
    # Real UR5e addresses, read by ur_real_entrypoint.sh (set in .env). Kept here,
    # not in the ur-real service: a service-level `environment:` would replace
    # this whole block (YAML merge is shallow) and drop CYCLONEDDS_URI etc.
    UR_ROBOT_IP: ${UR_ROBOT_IP:-192.168.0.101}
    UR_REVERSE_IP: ${UR_REVERSE_IP:-192.168.0.150}
    UR_HEADLESS_MODE: ${UR_HEADLESS_MODE:-true}
    UR_STATIC_MAP_TF: ${UR_STATIC_MAP_TF:-true}
    # This host's GPU is NVIDIA; Mesa's dri2/EGL path can't drive it through
    # a plain /dev/dri bind mount ("failed to create dri2 screen", driver
    # (null)). NVIDIA Container Toolkit injects the real vendor EGL/GL libraries
    # instead, gated by these two vars plus the device reservation below.
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: all
    # Hybrid laptop (prime-select on-demand): the X screen on $DISPLAY is
    # driven by the Intel iGPU, so GLX/EGL default to Mesa (llvmpipe inside
    # the container) and gz-sim's Ogre2 sensor rendering runs on the CPU
    # (RTF ~0.05). PRIME render offload routes GL to the NVIDIA dGPU.
    __NV_PRIME_RENDER_OFFLOAD: 1
    __GLX_VENDOR_LIBRARY_NAME: nvidia
    __EGL_VENDOR_LIBRARY_FILENAMES: /usr/share/glvnd/egl_vendor.d/10_nvidia.json
    __VK_LAYER_NV_optimus: NVIDIA_only
  group_add:
    # GID of the host's `render` group, which owns /dev/dri/renderD12*.
    # This is assigned per-machine by the GPU driver install, not portable —
    # check with `getent group render` if GUI rendering breaks again.
    - "110"
  devices:
    - "/dev/dri:/dev/dri"
    - /tmp/.X11-unix:/tmp/.X11-unix
    - /dev/input:/dev/input
  volumes:
    - tmp:/tmp
    - gz_fuel_cache:/home/robot/.gz/fuel
    # Dedicated vogui/jetson SSH key + config (aliases `vogui-board` and
    # `jetson`, ProxyJump through the main board), kept in a named volume so
    # it works on any host PC with no manual setup. Populated by the
    # `jetson-ssh-setup` service (jetson_ssh_setup.sh); lets `ssh jetson ...`
    # (e.g. the tunnel to the camera service used by
    # capture_camera_frames_action_server) resolve inside the container. The
    # user's personal key is never mounted.
    - jetson_ssh:/home/robot/.ssh:ro
    - ./../..:/renee:rw
    - ./build_pkgs.sh:/build_pkgs.sh:ro
    - ./world_spawn_entrypoint.sh:/world_spawn_entrypoint.sh:ro
    - ./robot_spawn_entrypoint.sh:/robot_spawn_entrypoint.sh:ro
    - ./slam_entrypoint.sh:/slam_entrypoint.sh:ro
    - ./slam_real_entrypoint.sh:/slam_real_entrypoint.sh:ro
    - ./navigation_entrypoint.sh:/navigation_entrypoint.sh:ro
    - ./navigation_real_entrypoint.sh:/navigation_real_entrypoint.sh:ro
    - ./localization_entrypoint.sh:/localization_entrypoint.sh:ro
    - ./localize_real_entrypoint.sh:/localize_real_entrypoint.sh:ro
    - ./moveit_entrypoint.sh:/moveit_entrypoint.sh:ro
    #- ./explore_entrypoint.sh:/explore_entrypoint.sh:ro
    - ./bt_entrypoint.sh:/bt_entrypoint.sh:ro
    - ./demo_spawn.sh:/demo_spawn.sh:ro
    - ./scanning_entrypoint.sh:/scanning_entrypoint.sh:ro
    - ./wrist_calibration_entrypoint.sh:/wrist_calibration_entrypoint.sh:ro
    - ./ur_real_entrypoint.sh:/ur_real_entrypoint.sh:ro

x-healthcheck-defaults: &healthcheck_defaults
  interval: 5s
  # ROS 2 discovery and TF queries can take a little over five seconds under
  # Gazebo load.  A 5 s Docker timeout killed otherwise successful readiness
  # checks, marking dependencies unhealthy and preventing Nav2 from starting.
  timeout: 20s
  retries: 3

# All healthchecks shell out to renee_bringup_utils' wait_for_ros (built into
# /renee/install by the `builder` service).
# --- renee_vision_modules (ZED + screw pose + FoundationPose 6D pose) -------------------------------
# Own images built from renee_vision_modules/docker/Dockerfile (ROS 2 Jazzy + ZED SDK + PyTorch),
# independent of the Gazebo sim image above. All services are behind the `vision` / `vision-fp`
# profiles so a plain `docker compose up` does not start (or build) them, e.g.:
#   docker compose --profile vision build vision-screw-pose
#   docker compose --profile vision up vision-screw-pose
# The ZED is on the Jetson (reached via the capture server), so there is no local ZED wrapper service.
x-vision: &vision
  image: robot-perception-platform:jazzy-zed
  build:
    context: ./renee_vision_modules
    dockerfile: docker/Dockerfile
    target: base
  network_mode: host
  ipc: host
  privileged: true
  environment:
    ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-0}
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: all
    DISPLAY: ${DISPLAY:-}
    # Same middleware and discovery settings as the sim/real services above, otherwise the vision
    # topics are invisible to the action servers. Must match x-gazebo-simulation.
    RMW_IMPLEMENTATION: rmw_cyclonedds_cpp
    CYCLONEDDS_URI: "<CycloneDDS><Domain><General><Interfaces><NetworkInterface name=\"lo\"/></Interfaces><AllowMulticast>false</AllowMulticast></General><Discovery><ParticipantIndex>auto</ParticipantIndex><MaxAutoParticipantIndex>120</MaxAutoParticipantIndex><Peers><Peer address=\"127.0.0.1\"/></Peers></Discovery></Domain></CycloneDDS>"
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu, compute, utility, graphics, video]
  volumes:
    - /dev:/dev
    - /dev/shm:/dev/shm
    - /tmp/.X11-unix:/tmp/.X11-unix
    - ./renee_vision_modules/local/models:/workspace/models
    - ./renee_vision_modules/local/shared:/workspace/shared
    - ./renee_vision_modules/local/output:/workspace/output
    - ./renee_vision_modules/local/calibration:/workspace/calibration
    - ./renee_vision_modules/local/cache:/workspace/cache
    - ./renee_vision_modules/local/zed_cache/resources:/usr/local/zed/resources
    - ./renee_vision_modules/local/zed_cache/settings:/usr/local/zed/settings

# 6D pose image: same volumes and GPU, built on top of the vision base image
x-vision-fp: &vision_fp
  <<: *vision
  image: robot-perception-platform:jazzy-zed-fp
  build:
    context: ./renee_vision_modules
    dockerfile: docker/Dockerfile
    target: fp
    args:
      CUDA_ARCH_LIST: ${CUDA_ARCH_LIST:-7.5;8.0;8.6;8.9;9.0;12.0}

services:
  fuel-cache-init:
    <<: *simulation
    user: "0:0"
    entrypoint: ["chown", "-R", "1000:1000", "/home/robot/.gz/fuel"]
    command: []
  jetson-ssh-setup:
    # One-shot, idempotent, non-fatal: creates the dedicated key + ssh config in
    # the jetson_ssh volume and, on first contact, authorises it (and this
    # host's public key) on the Vogui main board and the Jetson, so the host
    # can then `ssh -J robot@192.168.0.200 jetson@192.168.1.60` directly. Passwords
    # come from .env (VOGUI_PASSWORD, also read from the bridge's .env;
    # JETSON_PASSWORD) or an interactive prompt:
    #   docker compose run --rm jetson-ssh-setup
    # See jetson_ssh_setup.sh and .env.example.
    image: farshadnh/fnh_robotnik_sim:latest
    network_mode: host
    user: "0:0"
    entrypoint: ["bash", "/jetson_ssh_setup.sh"]
    command: []
    env_file:
      - path: vogui_ros1_ros2_bridge/.env
        required: false
      - path: .env
        required: false
    environment:
      JETSON_PASSWORD: ${JETSON_PASSWORD:-}
    volumes:
      - jetson_ssh:/home/robot/.ssh
      - ./jetson_ssh_setup.sh:/jetson_ssh_setup.sh:ro
      # Only the host's PUBLIC key is shared. Override with HOST_SSH_PUBKEY_FILE.
      - type: bind
        source: ${HOST_SSH_PUBKEY_FILE:-${HOME}/.ssh/id_ed25519.pub}
        target: /host_id.pub
        read_only: true
        bind:
          create_host_path: false
  jetson-code-sync:
    # One-shot, idempotent, non-fatal: keeps ~/renee_ws/src/renee_perception on the
    # Jetson in step with this host's ./renee_perception (compares the host HEAD
    # with the version recorded on the Jetson; transfers only when they differ,
    # keeping backups of anything it replaces and refusing to overwrite files
    # edited on the Jetson). Runs after jetson-ssh-setup, before the camera users.
    #   JETSON_SYNC=0 disables it; JETSON_SYNC_DRY_RUN=1 only prints the plan;
    #   JETSON_SYNC_SOURCE=worktree also sends uncommitted host changes (default: head);
    #   JETSON_SYNC_FORCE=1 overrides the overwrite refusal.
    # After a sync it restarts the camera service (not systemd) through the Jetson's
    # tools/camera_link_ctl.sh, and starts it when it is not running and nothing else
    # holds the camera (JETSON_CAMERA_RESTART=0 / JETSON_CAMERA_AUTOSTART=0 to stop that).
    # The first sync that would overwrite differing Jetson files needs consent (the host
    # copy is expected to win, old files are backed up):
    #   docker compose run --rm jetson-code-sync   (confirm at the prompt)
    # See jetson_code_sync.sh and .env.example.
    image: farshadnh/fnh_robotnik_sim:latest
    network_mode: host
    user: "1000:1000"
    entrypoint: ["bash", "/jetson_code_sync.sh"]
    command: []
    environment:
      HOME: /home/robot
      RENEE_PERCEPTION_DIR: /renee_perception
      VOGUI_HOST: ${VOGUI_HOST:-192.168.0.200}
      JETSON_SYNC: ${JETSON_SYNC:-1}
      JETSON_SYNC_SOURCE: ${JETSON_SYNC_SOURCE:-head}
      JETSON_SYNC_DRY_RUN: ${JETSON_SYNC_DRY_RUN:-0}
      JETSON_SYNC_FORCE: ${JETSON_SYNC_FORCE:-0}
      JETSON_CAMERA_RESTART: ${JETSON_CAMERA_RESTART:-${JETSON_SYNC_RESTART:-1}}
      JETSON_CAMERA_AUTOSTART: ${JETSON_CAMERA_AUTOSTART:-1}
      JETSON_CAMERA_HOLDERS: ${JETSON_CAMERA_HOLDERS:-}
      JETSON_TARGET_DIR: ${JETSON_TARGET_DIR:-renee_ws/src/renee_perception}
      JETSON_POST_SYNC_CMD: ${JETSON_POST_SYNC_CMD:-}
    volumes:
      - jetson_ssh:/home/robot/.ssh:ro
      - ./jetson_code_sync.sh:/jetson_code_sync.sh:ro
      - type: bind
        source: ./renee_perception
        target: /renee_perception
        read_only: true
        bind:
          create_host_path: false
      # renee_perception is a submodule: its .git is a pointer to
      # ../.git/modules/renee_perception, so the parent's .git must resolve at /.git.
      - type: bind
        source: ./.git
        target: /.git
        read_only: true
        bind:
          create_host_path: false
    depends_on:
      jetson-ssh-setup:
        condition: service_completed_successfully
        required: false
  jetson-camera-tunnel:
    # Long-running SSH tunnel to the camera link service on the Jetson, so the PC
    # action server (capture_camera_frames_action_server, link_host 127.0.0.1) can
    # reach it: 127.0.0.1:JETSON_LINK_PORT -> jetson:127.0.0.1:JETSON_LINK_REMOTE_PORT.
    # Starts after jetson-ssh-setup and jetson-code-sync, which bring up the key and
    # the Jetson-side code + camera service. On a host that is not on the rover's
    # network it exits cleanly and stays stopped; if the tunnel drops it restarts.
    # Stop any manual `ssh -N -L 7788:...` first (the port must be free).
    # Healthy = ssh is listening locally; it never connects through the forward
    # (the camera service keeps one client at a time and the newest wins).
    # See jetson_camera_tunnel.sh.
    image: farshadnh/fnh_robotnik_sim:latest
    network_mode: host
    user: "1000:1000"
    restart: on-failure
    entrypoint: ["bash", "/jetson_camera_tunnel.sh"]
    command: []
    environment:
      HOME: /home/robot
      VOGUI_HOST: ${VOGUI_HOST:-192.168.0.200}
      JETSON_LINK_PORT: ${JETSON_LINK_PORT:-7788}
      JETSON_LINK_REMOTE_PORT: ${JETSON_LINK_REMOTE_PORT:-${JETSON_LINK_PORT:-7788}}
    volumes:
      - jetson_ssh:/home/robot/.ssh:ro
      - ./jetson_camera_tunnel.sh:/jetson_camera_tunnel.sh:ro
    depends_on:
      jetson-ssh-setup:
        condition: service_completed_successfully
        required: false
      jetson-code-sync:
        condition: service_completed_successfully
        required: false
    healthcheck:
      test: ["CMD-SHELL", "awk -v a=0100007F:$$(printf '%04X' $${JETSON_LINK_PORT:-7788}) '$$4==\"0A\" && $$2==a {f=1} END{exit !f}' /proc/net/tcp"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 30s
  world-sim:
    <<: *simulation
    command: /world_spawn_entrypoint.sh
    depends_on:
      fuel-cache-init:
        condition: service_completed_successfully
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/renee/install/renee_bringup_utils/lib/renee_bringup_utils/healthcheck.sh",
             "topic", "/clock", "--msg"]
      start_period: 240s
  spawn-robot-sim:
    <<: *simulation
    command: /robot_spawn_entrypoint.sh
    depends_on:
      world-sim:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/renee/install/renee_bringup_utils/lib/renee_bringup_utils/healthcheck.sh",
             "controller", "/robot/controller_manager", "joint_trajectory_controller", "--state", "active"]
      start_period: 120s
  slam-sim:
    <<: *simulation
    command: /slam_entrypoint.sh
    depends_on:
      spawn-robot-sim:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/renee/install/renee_bringup_utils/lib/renee_bringup_utils/healthcheck.sh",
             "tf", "robot_map", "robot_odom"]
      start_period: 60s
  bridge-real:
    # ROS1 (Vogui/Noetic) <-> ROS2 (Jazzy) bridge for all *-real services.
    # Defined in the vogui_ros1_ros2_bridge submodule's own compose file
    # (robot IP/hostname, ROS_IP, CycloneDDS pinning, .env for the clock
    # sync); `extends` resolves its relative paths against that file.
    extends:
      file: vogui_ros1_ros2_bridge/docker-compose.yml
      service: ros1_ros2_bridge
    environment:
      ROS_MASTER_URI: http://${VOGUI_IP:-192.168.0.200}:11311
      ROS_IP: ${HOST_WIFI_IP:-192.168.0.199}
    # Built from the submodule if the image isn't present locally.
    build:
      context: vogui_ros1_ros2_bridge
      dockerfile: docker/Dockerfile
    volumes:
      # Run the submodule's current scripts instead of the copies baked into
      # the image at build time, so a submodule bump doesn't need a rebuild.
      - ./vogui_ros1_ros2_bridge/docker/entrypoint.sh:/entrypoint.sh:ro
      - ./vogui_ros1_ros2_bridge/scripts/tf_map_filter.py:/tf_map_filter.py:ro
      # The image has plain Jazzy but not this workspace, so mount
      # wait_for_ros (pure rclpy) directly for the healthcheck.
      - ./renee_bringup_utils/renee_bringup_utils/wait_for_ros.py:/wait_for_ros.py:ro
    healthcheck:
      <<: *healthcheck_defaults
      # Healthy only once robot odom actually arrives on the ROS2 side, i.e.
      # the Vogui's master is reachable and data is flowing (not just that
      # parameter_bridge started).
      test: ["CMD", "bash", "-c",
             "source /opt/ros/jazzy/setup.bash && python3 /wait_for_ros.py --timeout 3 topic /robot/robotnik_base_control/odom --msg"]
      start_period: 60s
  slam-real:
    <<: *simulation
    # Real-robot mapping: consumes odom/scan/tf relayed by `bridge-real`
    # instead of Gazebo. Same slam_toolbox launch /
    # configs/mapper_params_online_async.yaml as the `slam-sim` service —
    # only the data source differs.
    # Uses its own entrypoint (not slam_entrypoint.sh) to also bring up an
    # RViz window: the sim `slam-sim` service already gets one via
    # robot_spawn_entrypoint.sh (Fixed Frame: world), but that frame doesn't
    # exist in the real-robot TF tree.
    command: /slam_real_entrypoint.sh
    depends_on:
      bridge-real:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/renee/install/renee_bringup_utils/lib/renee_bringup_utils/healthcheck.sh",
             "tf", "robot_map", "robot_odom"]
      start_period: 60s
  localize-real:
    <<: *simulation
    # Real-robot localization: loads the map/ maps/real_robot_environment
    # built by slam-real and localizes against it using the same bridged
    # odom/scan/tf data. Separate from `localize-sim` (Gazebo-sim, untouched
    # here on purpose) since the params file, map, and use_sim_time all
    # differ — see configs/mapper_params_localization_real.yaml.
    command: /localize_real_entrypoint.sh
    depends_on:
      bridge-real:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/renee/install/renee_bringup_utils/lib/renee_bringup_utils/healthcheck.sh",
             "tf", "robot_map", "robot_odom"]
      start_period: 60s
  navigate-sim:
    <<: *simulation
    command: /navigation_entrypoint.sh
    depends_on:
      localize-sim:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/renee/install/renee_bringup_utils/lib/renee_bringup_utils/healthcheck.sh",
             "node", "/robot/bt_navigator"]
      start_period: 60s
  navigate-real:
    <<: *simulation
    # Real-robot Nav2: analogous to `navigate-sim` (Gazebo-sim), but depends on
    # `localize-real` instead of `localize-sim`, and uses
    # navigation_real_entrypoint.sh to point controller_server/behavior_server
    # at the *_real.yaml configs (plain Twist cmd_vel on
    # /robot/move_base/cmd_vel, use_sim_time: false) required by
    # vogui_ros1_ros2_bridge — see that entrypoint's comments.
    command: /navigation_real_entrypoint.sh
    depends_on:
      bridge-real:
        condition: service_healthy
      localize-real:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/renee/install/renee_bringup_utils/lib/renee_bringup_utils/healthcheck.sh",
             "node", "/robot/bt_navigator"]
      start_period: 60s
  ur-real:
    <<: *simulation
    # Real UR5e: ur_robot_driver + MoveIt + RViz (start_moveit_real.launch.py).
    # Env overrides: UR_ROBOT_IP (default 192.168.0.101), UR_REVERSE_IP (this
    # host's wired IP, default 192.168.0.150), UR_END_EFFECTOR, UR_USE_RVIZ.
    # Needs the External Control URCap program running on the pendant (host IP
    # = UR_REVERSE_IP) before trajectories execute.
    # NOTE: the rover (wifi) and UR (LAN) share 192.168.0.0/24 and ethernet wins
    # the route; host routes are needed or the rover goes unreachable:
    #   sudo ip route add 192.168.0.200/32 dev wlp0s20f3 src 192.168.0.199
    #   sudo ip route add 192.168.0.101/32 dev enp0s31f6 src 192.168.0.150
    # Standalone: no rover/navigation dependency. The entrypoint publishes a
    # static robot_map (identity) + the rover's fixed footprint->chassis chain
    # for MoveIt (UR_STATIC_MAP_TF=false if the rover stack runs alongside).
    command: /ur_real_entrypoint.sh
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/renee/install/renee_bringup_utils/lib/renee_bringup_utils/healthcheck.sh",
             "action", "/robot/move_action"]
      start_period: 90s
  localize-sim:
    <<: *simulation
    command: /localization_entrypoint.sh
    depends_on:
      spawn-robot-sim:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/renee/install/renee_bringup_utils/lib/renee_bringup_utils/healthcheck.sh",
             "tf", "robot_map", "robot_odom"]
      start_period: 60s
  # explore:
  #   <<: *simulation
  #   command: /explore_entrypoint.sh
  moveit:
    <<: *simulation
    command: /moveit_entrypoint.sh
    depends_on:
      spawn-robot-sim:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/renee/install/renee_bringup_utils/lib/renee_bringup_utils/healthcheck.sh",
             "action", "/robot/move_action"]
      start_period: 120s
  # joystick:
  #   <<: *simulation
  #   command: ros2 launch teleop_twist_joy teleop-launch.py config_filepath:=/renee/custom.config.yaml joy_vel:=/robot/robotnik_base_control/cmd_vel_unstamped
  bt:
    <<: *simulation
    command: /bt_entrypoint.sh
    depends_on:
      moveit:
        condition: service_healthy
      navigate-sim:
        condition: service_healthy
    healthcheck:
      <<: *healthcheck_defaults
      test: ["CMD", "/renee/install/renee_bringup_utils/lib/renee_bringup_utils/healthcheck.sh",
             "topic", "/bt_task_status"]
      start_period: 30s
  builder:
    <<: *simulation
    command: /build_pkgs.sh
  ros_terminal:
    <<: *simulation
    command: bash
    depends_on:
      jetson-ssh-setup:
        condition: service_completed_successfully
        required: false
      jetson-code-sync:
        condition: service_completed_successfully
        required: false
      jetson-camera-tunnel:
        condition: service_started
        required: false
  demo:
    <<: *simulation
    command: /demo_spawn.sh
  scanning:
    <<: *simulation
    command: /scanning_entrypoint.sh
    depends_on:
      jetson-ssh-setup:
        condition: service_completed_successfully
        required: false
      jetson-code-sync:
        condition: service_completed_successfully
        required: false
      jetson-camera-tunnel:
        condition: service_started
        required: false
  # Wrist-camera hand-eye calibration (package wrist_camera_calibration). Start the robot + MoveIt
  # (sim or real) first, put a fixed ChArUco board on the desk, then:
  #   WCC_ARGS="num_images:=20" docker compose up wrist-calibration   (WCC_ARGS = extra launch args)
  # Results go to wrist_camera_calibration/saved/ (mounted workspace). Needs DISPLAY for the GUI and an
  # arm_camera GrabFrame server (the real one, or the `wrist-calibration-mock` service for tests).
  wrist-calibration:
    <<: *simulation
    command: /wrist_calibration_entrypoint.sh calibrate ${WCC_ARGS:-}
    depends_on:
      jetson-ssh-setup:
        condition: service_completed_successfully
        required: false
      jetson-code-sync:
        condition: service_completed_successfully
        required: false
      jetson-camera-tunnel:
        condition: service_started
        required: false
  # Publishes robot_arm_tool0 -> wrist_camera_calibrated_optical_frame from the saved calibration.
  wrist-calibration-tf:
    <<: *simulation
    command: /wrist_calibration_entrypoint.sh tf ${WCC_ARGS:-}
  wrist-calibration-mock:
    <<: *simulation
    command: /wrist_calibration_entrypoint.sh mock ${WCC_ARGS:-}
  # Action servers for a real-arm calibration: arm planner (/moveit_arm_joint_motion_plan, needs MoveIt
  # from `ur-real` running) + the ZED CaptureCameraFrames server (needs the Jetson link: the jetson-*
  # services). Start this first, then wrist-calibration and wrist-calibration-rviz. For a camera server
  # started elsewhere: WCC_CAMERA_SERVER=0.
  wrist-calibration-servers:
    <<: *simulation
    command: /wrist_calibration_entrypoint.sh servers
    depends_on:
      jetson-ssh-setup:
        condition: service_completed_successfully
        required: false
      jetson-code-sync:
        condition: service_completed_successfully
        required: false
      jetson-camera-tunnel:
        condition: service_started
        required: false
  # RViz with the "Calibration Status" panel (live state, stage, progress, next target), the robot, the
  # planning scene (desk slab) and the planned / next-target views. Separate RViz instance: the robot's own
  # RViz (ur-real) is not touched. Needs DISPLAY.
  wrist-calibration-rviz:
    <<: *simulation
    command: /wrist_calibration_entrypoint.sh rviz ${WCC_ARGS:-}
  vision-screw-pose:
    <<: *vision
    profiles: ["vision"]
    command: >-
      bash -lc '
      python3 /opt/robot_platform/docker/check_env.py >/tmp/check.log 2>&1 || { cat /tmp/check.log; exit 2; };
      test -f /workspace/calibration/zed2i_intrinsics.json || { echo "Missing intrinsics. Run: renee_vision_modules/scripts/export_intrinsics.sh"; exit 2; };
      ros2 launch screw_pose_ros2 screw_pose_live.launch.py target_frame:=${TARGET_FRAME:-}'
  # fully automatic 6D pose: docker compose --profile vision-fp run --rm vision-fp-auto --data ... --cad ... --out ...
  vision-fp-auto:
    <<: *vision_fp
    profiles: ["vision-fp"]
    entrypoint: ["/entrypoint.sh", "fp_auto"]
    command: ["--help"]
volumes:
  tmp:
  gz_fuel_cache:
  jetson_ssh:
