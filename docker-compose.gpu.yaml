# Optional override to enable NVIDIA GPU acceleration for the simulation
# services. Requires the NVIDIA Container Toolkit installed on the host
# (see README.md). Usage:
#   docker compose -f docker-compose.yaml -f docker-compose.gpu.yaml up world-sim spawn-robot-sim
x-gazebo-simulation-gpu: &simulation_gpu
  environment:
    NVIDIA_VISIBLE_DEVICES: all
    NVIDIA_DRIVER_CAPABILITIES: all
  deploy:
    resources:
      reservations:
        devices:
          - driver: nvidia
            count: all
            capabilities: [gpu]

services:
  world-sim:
    <<: *simulation_gpu
  spawn-robot-sim:
    <<: *simulation_gpu
  slam-sim:
    <<: *simulation_gpu
  navigate-sim:
    <<: *simulation_gpu
  localize-sim:
    <<: *simulation_gpu
  moveit:
    <<: *simulation_gpu
  bt:
    <<: *simulation_gpu
  builder:
    <<: *simulation_gpu
  ros_terminal:
    <<: *simulation_gpu
  demo:
    <<: *simulation_gpu
  scanning:
    <<: *simulation_gpu
